<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador de oferta</title>
<script src="js/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
<h1>Generador de oferta</h1>
<p class="sub">Complete los datos, agregue los ítems con los menús desplegables y genere el Word con las descripciones.</p>

<section class="card"><h2>Datos generales</h2>
<div class="grid">
<div><label for="cli">Cliente</label><input id="cli" type="text"></div>
<div><label for="con">Constructora</label><input id="con" type="text"></div>
<div><label for="pro">Proyecto</label><input id="pro" type="text"></div>
<div><label for="ini">Iniciales (pie de página)</label><input id="ini" type="text" placeholder="Ej. JC/AV"></div>
<div><label for="seq">Consecutivo (número de propuesta)</label><input id="seq" type="text" placeholder="Ej. 2026-01234"></div>
<div><label for="ven">Vendedor</label><select id="ven"></select></div>
<div style="grid-column:1/-1"><label for="des">Descripción (se muestra como «Descripción para el proyecto …»)</label><input id="des" type="text" placeholder="Ej. Suministro e instalación del sistema de agua helada"></div>
</div></section>

<section class="card"><h2 id="ft-eq">Agregar equipos</h2>
<div class="tabs" id="tabs-eq"></div>
<div id="form-eq"></div>
<div class="row"><button class="btn" id="add-eq">Agregar a la oferta</button><button class="btn sec" id="cancel-eq" hidden>Cancelar edición</button><span class="msg" id="msg-eq"></span></div>
</section>

<section class="card"><h2 id="ft-ma">Agregar material</h2>
<div class="tabs" id="tabs-ma"></div>
<div id="form-ma"></div>
<div class="row"><button class="btn" id="add-ma">Agregar a la oferta</button><button class="btn sec" id="cancel-ma" hidden>Cancelar edición</button><span class="msg" id="msg-ma"></span></div>
</section>

<section class="card"><h2>Ítems de la oferta <span id="cnt" style="color:var(--mu);font-weight:400"></span></h2><div id="list"></div></section>

<section class="card"><h2>Alcance y condiciones</h2>
<div class="tabs" id="tabs-nt"></div>
<div class="notes" id="notes"></div></section>

<div class="row"><button class="btn" id="gen" disabled>Generar oferta</button><button class="btn" id="gen-en" disabled>Generar oferta-Inglés</button><button class="btn sec" id="clr">Limpiar todo</button><button class="btn sec" id="clrc" hidden>Cancelar</button><span class="msg" id="gm"></span></div>
</main>

<script src="js/01-catalogo.js"></script>
<script src="js/02-formulario.js"></script>
<script src="js/03-plantillas.js"></script>
<script src="js/04-notas.js"></script>
<script src="js/05-word.js"></script>
<script src="js/06-inicio.js"></script>
</body>
</html>
